apiVersion: apps/v1
kind: Deployment
metadata:
  name: vproapp
  labels:
    app: vproapp

spec:

  selector:
    matchLabels:
      app: vproapp

  template:
    metadata:
      labels:
        app: vproapp

    spec:
      containers:
        - name: vproapp
          image: {{ .Values.appimage | quote }}

          ports:
            - name: vproapp-port
              containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20

      initContainers:
        - name: init-mydb
          image: busybox
          command:
            - sh
            - -c
            - >
              until nslookup
              vprodb.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local;
              do echo waiting for mydb;
              sleep 2;
              done;

        - name: init-memcache
          image: busybox
          command:
            - sh
            - -c
            - >
              until nslookup
              vprocache01.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local;
              do echo waiting for memcache;
              sleep 2;
              done;